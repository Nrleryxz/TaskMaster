<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskMaster - Yapılacaklar Listesi</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>TaskMaster</h1>
        <button id="themeToggle">Karanlık Mod</button>

        <form id="taskForm">
            <input type="text" id="taskInput" placeholder="Yeni görev ekle..." autocomplete="off" required />
            <button type="submit">Ekle</button>
        </form>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
